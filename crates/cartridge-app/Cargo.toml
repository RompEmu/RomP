[package]
name = "cartridge-app"
version.workspace = true
edition.workspace = true

[[bin]]
name = "cartridge"
path = "src/main.rs"

[dependencies]
cartridge-proto = { workspace = true }
anyhow = "1"
clap = { version = "4", features = ["derive"] }
dirs = "6"
slint = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[build-dependencies]
slint-build = "1"

[dev-dependencies]
tempfile = "3"
