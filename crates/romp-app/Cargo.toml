[package]
name = "romp-app"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[[bin]]
name = "romp"
path = "src/main.rs"

[package.metadata.cargo-machete]
ignored = ["md-5", "sdl3-sys"]

[dependencies]
romp-cheevos = { workspace = true }
romp-proto = { workspace = true }
anyhow = "1"
clap = { version = "4", features = ["derive"] }
arboard = "3"
dirs = "7"
dunce = "1"
sdl3 = { version = "0.20", features = ["build-from-source-static"] }
# Only controllers come from SDL, so nothing else is built, nor needs its system libraries.
sdl3-sys = { version = "0.7", features = ["no-sdl-audio", "no-sdl-camera", "no-sdl-dialog", "no-sdl-gpu", "no-sdl-render", "no-sdl-tray", "no-sdl-video", "sdl-unix-console-build"] }
glow = "0.17"
httpdate = "1"
image = { version = "0.25", default-features = false, features = ["ico", "jpeg", "png", "webp"] }
getrandom = "0.4"
keyring = "4"
librashader = { version = "0.12", default-features = false, features = ["runtime-gl", "presets", "preprocess"] }
md-5 = "0.11"
rusqlite = { version = "0.40", features = ["bundled"] }
open = "5"
qrcode = { version = "0.14", default-features = false }
reqwest = { version = "0.13", features = ["json", "multipart", "query"] }
rspolib = "0.1"
sha1 = "0.11"
sha2 = "0.11"
sevenz-rust2 = { version = "0.23", default-features = false, features = ["bzip2", "deflate", "ppmd"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
slint = { version = "1", features = ["unstable-winit-030"] }
sys-locale = "0.3"
thiserror = "2"
toml = "1.1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "sync", "fs"] }
tr = { version = "0.1.11", default-features = false, features = ["mo-translator"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
url = "2"
zip = { version = "8", default-features = false, features = ["deflate-flate2-zlib-rs"] }

[build-dependencies]
slint-build = "1"

[target.'cfg(windows)'.build-dependencies]
winresource = "0.1"

[dev-dependencies]
tempfile = "3"
wiremock = "0.6"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_System_Threading"] }

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "NSApplication", "NSImage", "NSResponder"] }
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSData", "NSProcessInfo", "NSString"] }

[lints]
workspace = true
