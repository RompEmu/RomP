[package]
name = "romp-app"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[[bin]]
name = "romp"
path = "src/main.rs"

[package.metadata.cargo-machete]
ignored = ["md-5"]

[dependencies]
romp-proto = { workspace = true }
anyhow = "1"
clap = { version = "4", features = ["derive"] }
arboard = "3"
dirs = "7"
gilrs = "0.11"
httpdate = "1"
image = { version = "0.25", default-features = false, features = ["ico", "jpeg", "png", "webp"] }
getrandom = "0.3"
keyring = "4"
md-5 = "0.10"
rusqlite = { version = "0.40", features = ["bundled"] }
open = "5"
qrcode = { version = "0.14", default-features = false }
reqwest = { version = "0.13", features = ["json", "multipart", "query"] }
sha1 = "0.11"
sha2 = "0.11"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
slint = { version = "1", features = ["unstable-winit-030"] }
thiserror = "2"
toml = "0.9"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "sync", "fs"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
url = "2"
zip = { version = "8", default-features = false, features = ["deflate-flate2-zlib-rs"] }

[build-dependencies]
slint-build = "1"

[target.'cfg(windows)'.build-dependencies]
winresource = "0.1"

[dev-dependencies]
tempfile = "3"
wiremock = "0.6"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_System_Threading"] }

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "NSApplication", "NSImage", "NSResponder"] }
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSData"] }

[lints]
workspace = true
