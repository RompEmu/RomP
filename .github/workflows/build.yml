name: Build

on:
  workflow_call:
    inputs:
      version:
        required: true
        type: string
  workflow_dispatch:
    inputs:
      version:
        required: true
        type: string
        default: nightly

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS
            os: macos-latest
          # The oldest supported Ubuntu LTS, so the Linux build runs on it and everything newer.
          - name: Linux
            os: ubuntu-22.04
          - name: Windows
            os: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          # Objects built on one Ubuntu don't link on an older one.
          key: ${{ matrix.os }}
      - name: Install Linux libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libasound2-dev libegl-dev libfontconfig1-dev libpulse-dev libudev-dev libwayland-dev libxkbcommon-dev \
            libxkbcommon-x11-0 patchelf appstream
      - name: Install Make
        if: runner.os == 'Windows'
        run: choco install make --no-progress -y
      - run: make dist VERSION="$VERSION"
        env:
          VERSION: ${{ inputs.version }}
          APPIMAGE_EXTRACT_AND_RUN: 1
      - name: Check the glibc the Linux build needs
        if: runner.os == 'Linux'
        run: make glibc-check
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: romp-${{ runner.os }}
          path: |
            dist/*.zip
            dist/*.tar.gz
            dist/*.AppImage
            dist/*.deb
            dist/*.rpm
            dist/*.sha512
          if-no-files-found: error
