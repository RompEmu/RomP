name: Smoke test

# Plays a game in each packaged build. Release runs it on the packages it built, before
# publishing; running it by hand builds the packages first.
on:
  workflow_call:
  workflow_dispatch:

permissions: {}

jobs:
  build:
    if: github.event_name == 'workflow_dispatch'
    uses: ./.github/workflows/build.yml
    permissions:
      contents: read
    with:
      version: smoke

  smoke:
    needs: build
    if: ${{ !cancelled() && needs.build.result != 'failure' }}
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    container: ${{ matrix.container }}
    timeout-minutes: 15
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS
            os: macos-latest
            cores: apple/osx/arm64
            library: dylib
          # A bare container of the oldest supported Ubuntu, so the AppImage can't lean on a
          # library the runner happens to have.
          - name: Linux AppImage
            os: ubuntu-latest
            container: ubuntu:22.04
            package: appimage
            cores: linux/x86_64
            library: so
          # The packages are installed the way a user would, so apt and dnf bring the libraries
          # they depend on, and a missing dependency fails here.
          - name: Linux deb
            os: ubuntu-latest
            container: ubuntu:22.04
            package: deb
            cores: linux/x86_64
            library: so
          # The oldest Fedora still supported.
          - name: Linux rpm
            os: ubuntu-latest
            container: fedora:43
            package: rpm
            cores: linux/x86_64
            library: so
          # The same .rpm on openSUSE, whose packages are named differently from Fedora's.
          - name: Linux rpm on openSUSE
            os: ubuntu-latest
            container: opensuse/leap:16.0
            package: rpm-opensuse
            cores: linux/x86_64
            library: so
          - name: Windows
            os: windows-latest
            cores: windows/x86_64
            library: dll
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: romp-${{ runner.os }}
          path: dist
      # Only what every Linux desktop has, PipeWire ones included: Mesa, X11's client libraries,
      # fontconfig with a font, and PulseAudio's library. libxkbcommon-x11 is left out on
      # purpose, as minimal installs don't have it, so the AppImage has to bring its own.
      - name: Install a virtual display and a desktop's libraries
        if: matrix.package == 'appimage'
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          apt-get update
          apt-get install -y --no-install-recommends ca-certificates curl python3 xvfb xauth \
            libgl1-mesa-dri libegl1 libx11-6 libx11-xcb1 libxcursor1 libxi6 libxrender1 \
            libfontconfig1 fonts-dejavu-core libpulse0
      # Only the display and the tools the test needs besides the package, which brings the rest.
      - name: Install a virtual display and the .deb
        if: matrix.package == 'deb'
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          apt-get update
          apt-get install -y --no-install-recommends ca-certificates curl python3 xvfb xauth \
            libgl1-mesa-dri libpulse0 ./dist/*.deb
      - name: Install a virtual display and the .rpm
        if: matrix.package == 'rpm'
        run: |
          dnf install -y --setopt=install_weak_deps=False python3 xorg-x11-server-Xvfb xauth \
            mesa-dri-drivers util-linux dejavu-sans-fonts pulseaudio-libs ./dist/*.rpm
      - name: Install a virtual display and the .rpm on openSUSE
        if: matrix.package == 'rpm-opensuse'
        run: |
          zypper --non-interactive install --no-recommends --allow-unsigned-rpm curl python3 \
            xvfb-run xauth Mesa-dri util-linux dejavu-fonts libpulse0 ./dist/*.rpm
      - name: Unpack Romp
        env:
          PACKAGE: ${{ matrix.package }}
        run: |
          case "$RUNNER_OS" in
            macOS)
              ditto -x -k dist/*-macos-*.zip app
              echo "ROMP=$PWD/app/RomP.app" >> "$GITHUB_ENV"
              ;;
            Linux)
              if [ "$PACKAGE" = appimage ]; then
                chmod +x dist/*.AppImage
                echo "ROMP=$(ls "$PWD"/dist/*.AppImage)" >> "$GITHUB_ENV"
              else
                echo "ROMP=/usr/bin/romp" >> "$GITHUB_ENV"
              fi
              ;;
            Windows)
              7z x -bso0 -oapp dist/*-windows-*.zip
              echo "ROMP=$(ls "$PWD"/app/*/romp.exe)" >> "$GITHUB_ENV"
              ;;
          esac
      - name: Play a game on each core
        env:
          CORES: ${{ matrix.cores }}
          LIBRARY: ${{ matrix.library }}
          APPIMAGE_EXTRACT_AND_RUN: 1
        run: |
          python="$(command -v python3 || command -v python)"
          "$python" .github/smoke/make_games.py games
          mkdir -p cores out
          run=()
          if [ "$RUNNER_OS" = Linux ]; then run=(xvfb-run -a -s "-screen 0 1280x1024x24"); fi
          failed=()
          while read -r core game console; do
            case "$core" in ''|'#'*) continue ;; esac
            library="cores/${core}_libretro.$LIBRARY"
            if [ ! -f "$library" ]; then
              url="https://buildbot.libretro.com/nightly/$CORES/latest/${core}_libretro.$LIBRARY.zip"
              # FAKE-08 isn't on the buildbot: Romp downloads it from RompEmu's own fork.
              if [ "$core" = fake08 ]; then
                case "$CORES" in
                  apple/*) target=macos-arm64 ;;
                  windows/*) target=windows-x86_64 ;;
                  *) target=linux-x86_64 ;;
                esac
                url="https://github.com/RompEmu/fake-08/releases/latest/download/fake08_libretro-$target.zip"
              fi
              curl -fsSL -o core.zip "$url"
              "$python" -m zipfile -e core.zip cores
            fi
            name="$core-${game%.*}"
            args=(--core "$PWD/$library" --rom "$PWD/games/$game" --smoke "$PWD/out/$name")
            if [ "$RUNNER_OS" = macOS ]; then
              # Started the way Finder starts it. The runner has no GPU, and OpenGL without one
              # draws so slowly that the window holds the game up, so Romp draws on the CPU here.
              open -W -n "$ROMP" --env "ROMP_PLATFORM=$console" --env SLINT_BACKEND=winit-software \
                --stdout "$PWD/out/$name.log" --stderr "$PWD/out/$name.err" --args "${args[@]}" || true
            else
              ROMP_PLATFORM="$console" "${run[@]}" "$ROMP" "${args[@]}" > "out/$name.log" 2>&1 < /dev/null || true
            fi
            if grep -qx passed "out/$name/result.txt" 2> /dev/null; then
              echo "Played $game on $core"
            else
              echo "::error::$game didn't play on $core"
              cat "out/$name/result.txt" 2> /dev/null || true
              tail -n 20 "out/$name.log"
              failed+=("$name")
            fi
          done < .github/smoke/games.txt
          test "${#failed[@]}" -eq 0
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: smoke-${{ matrix.name }}
          path: out
          if-no-files-found: ignore
