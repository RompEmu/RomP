name: Smoke test

# Plays a game in each packaged build. Release runs it on the packages it built, before
# publishing; running it by hand builds the packages first.
on:
  workflow_call:
  workflow_dispatch:
  push:
    branches: [smoke-test]

permissions: {}

jobs:
  build:
    if: github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/smoke-test'
    uses: ./.github/workflows/build.yml
    permissions:
      contents: read
    with:
      version: smoke

  smoke:
    needs: build
    if: ${{ !cancelled() && needs.build.result != 'failure' }}
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS
            os: macos-latest
            cores: apple/osx/arm64
            library: dylib
          - name: Linux
            os: ubuntu-latest
            cores: linux/x86_64
            library: so
          - name: Windows
            os: windows-latest
            cores: windows/x86_64
            library: dll
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: romp-${{ runner.os }}
          path: dist
      # libpulse0 is on every Linux desktop, PipeWire ones included, but not on the runner.
      - name: Install a virtual display and PulseAudio's library
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends xvfb libgl1-mesa-dri libegl1 libxkbcommon-x11-0 libpulse0
      - name: Unpack Romp
        run: |
          case "$RUNNER_OS" in
            macOS)
              ditto -x -k dist/*-macos-*.zip app
              echo "ROMP=$PWD/app/Romp.app/Contents/MacOS/romp" >> "$GITHUB_ENV"
              ;;
            Linux)
              chmod +x dist/*.AppImage
              echo "ROMP=$(ls "$PWD"/dist/*.AppImage)" >> "$GITHUB_ENV"
              ;;
            Windows)
              7z x -bso0 -oapp dist/*-windows-*.zip
              echo "ROMP=$(ls "$PWD"/app/*/romp.exe)" >> "$GITHUB_ENV"
              ;;
          esac
      - name: Play a game on each core
        env:
          CORES: ${{ matrix.cores }}
          LIBRARY: ${{ matrix.library }}
          APPIMAGE_EXTRACT_AND_RUN: 1
        run: |
          python="$(command -v python3 || command -v python)"
          "$python" .github/smoke/make_games.py games
          mkdir -p cores out
          run=()
          if [ "$RUNNER_OS" = Linux ]; then run=(xvfb-run -a -s "-screen 0 1280x1024x24"); fi
          failed=()
          while read -r core game console; do
            case "$core" in ''|'#'*) continue ;; esac
            library="cores/${core}_libretro.$LIBRARY"
            if [ ! -f "$library" ]; then
              curl -fsSL -o core.zip "https://buildbot.libretro.com/nightly/$CORES/latest/${core}_libretro.$LIBRARY.zip"
              "$python" -m zipfile -e core.zip cores
            fi
            name="$core-${game%.*}"
            if ROMP_PLATFORM="$console" "${run[@]}" "$ROMP" --core "$PWD/$library" --rom "games/$game" \
              --smoke "out/$name" > "out/$name.log" 2>&1 < /dev/null; then
              echo "Played $game on $core"
            else
              echo "::error::$game didn't play on $core"
              tail -n 20 "out/$name.log"
              failed+=("$name")
            fi
          done < .github/smoke/games.txt
          test "${#failed[@]}" -eq 0
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: smoke-${{ runner.os }}
          path: out
          if-no-files-found: ignore
