version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      actions:
        patterns: ["*"]

  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: monthly
    cooldown:
      default-days: 7
    groups:
      crates:
        update-types: [minor, patch]
      crates-breaking:
        update-types: [major]
    ignore:
      # glow moves with librashader, whose breaking update fails CI until glow is bumped alongside it.
      - dependency-name: glow
        update-types: ["version-update:semver-major"]
